# Vulnerabilities the scan reports and this deployment accepts, each with a reason and
# an expiry date.
#
# **Every entry expires.** That is the point of this file rather than a `--severity`
# threshold or a disabled job. A suppression with no end date is indistinguishable from
# not scanning, and it is how a finding that was genuinely unreachable in August becomes
# a finding nobody looked at again after the code that made it unreachable changed.
#
# When one expires the scan goes red and somebody has to decide again. That is the
# correct amount of friction: re-deciding costs a few minutes, and the alternative is a
# permanent exception nobody remembers granting.
#
# What does NOT belong here: anything reachable from this platform's code. If a finding
# touches a path the product actually executes, the fix is the upgrade, not a line here.
#
# ---------------------------------------------------------------------------------------
# The work these entries are deferring, so that whoever picks it up is not starting from
# a CVE number and a shrug.
#
# **FastAPI 0.116.1 -> 0.141.x, Starlette 0.47.3 -> 1.3.x.** Resolution was checked: with
# `fastapi>=0.121` unpinned, uv resolves FastAPI 0.141.1 cleanly, so there is no
# dependency conflict to solve -- what remains is behaviour.
#
# Treat it as its own scoped piece of work, not something folded into another week. It is
# a major version on Starlette, and these are the surfaces that move:
#
#   * **Middleware.** Starlette's middleware stack and exception handling changed shape
#     across 1.0. This API has custom middleware for request context, the identity
#     gateway secret, and CORS/origin refusal -- and the origin check is a security
#     control, so "the tests pass" is not the bar. Re-run the cross-origin refusal suite
#     deliberately.
#   * **Response handling.** Streaming, background tasks, and status-code edge cases.
#     Report delivery goes through a single-use grant and returns a whole document.
#   * **StaticFiles, form parsing, FileResponse.** Not used today -- which is exactly the
#     argument these three suppressions rest on. Re-check that claim as part of the
#     upgrade rather than inheriting it; if any of the three has since been introduced,
#     the findings were live in the interval and that is worth knowing.
#   * **TestClient.** Its construction and lifespan handling have changed before, and the
#     API test suite is built on it.
#
# `tests/operations/test_accepted_findings_expire.py` fails 30 days before these lapse
# -- on 2026-10-13 -- so this arrives with runway rather than as an emergency. Extending
# the dates instead of doing the work is possible and is visible in the diff; the reason
# field above is where an honest re-decision has to show itself.
# ---------------------------------------------------------------------------------------

vulnerabilities:
  # Three Starlette findings, all reported through FastAPI 0.116.1, which caps Starlette
  # below 0.48 -- so none can be fixed without moving FastAPI to 0.141 and Starlette
  # across a major version. That upgrade is worth doing and is not worth doing blind, so
  # it is a decision rather than a drive-by.
  #
  # None of the three is reachable from this codebase, and each was checked rather than
  # assumed:
  #
  #   * `StaticFiles` appears nowhere -- the API serves no static assets; the web app is
  #     a separate Next.js service.
  #   * No endpoint parses a form. Every request body in this API is JSON, which is a
  #     property of the OpenAPI contract and enforced by the contract gate.
  #   * No endpoint returns a `FileResponse` or honours a `Range` header. Reports are
  #     returned as whole documents through a single-use grant.
  #
  # Re-check those three claims when this expires; if any has become false, the finding
  # is live and the upgrade is due.
  - id: CVE-2025-62727
    statement: >-
      Starlette DoS via Range header merging. No endpoint in this API serves ranged
      responses. Capped by FastAPI 0.116.1; fixing needs FastAPI 0.141 + Starlette 1.x.
    expired_at: 2026-11-12

  - id: CVE-2026-48818
    statement: >-
      Starlette SSRF and NTLM credential theft via UNC paths in StaticFiles. StaticFiles
      is not used; the API serves no static assets. Same upgrade needed as above.
    expired_at: 2026-11-12

  - id: CVE-2026-54283
    statement: >-
      Starlette form() limits silently ignored for urlencoded bodies, enabling DoS. No
      endpoint parses a form; every request body here is JSON. Same upgrade needed.
    expired_at: 2026-11-12
