[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "siembiot"
version = "0.0.0"
description = "Security-first community cyber health assessment platform"
requires-python = "==3.13.*"
license = "MIT"
dependencies = [
    "alembic==1.16.5",
    "celery[redis]==5.5.3",
    "cryptography==50.0.0",
    "dnspython==2.8.0",
    "fastapi==0.116.1",
    "httpx==0.28.1",
    "idna==3.18",
    "psycopg[binary]==3.2.9",
    "pydantic-settings==2.10.1",
    "sqlalchemy==2.0.43",
    "uvicorn==0.35.0",
]

[dependency-groups]
dev = [
    "jsonschema==4.25.1",
    # For the infrastructure gate. The compose files apply their hardening through a
    # YAML anchor (`<<: *hardening`), and a hand-rolled parser that silently failed to
    # resolve it would report every service as unhardened -- or, worse, report nothing
    # and pass. The alert-rules parser already made that mistake once with a folded
    # scalar; this is not the place to make it again.
    "pyyaml==6.0.2",
    "hypothesis==6.165.0",
    "mypy==1.17.1",
    "pytest==8.4.1",
    "pytest-postgresql==7.0.2",
    "ruff==0.12.8",
    "types-jsonschema==4.25.1.20251009",
    "types-pyyaml==6.0.12.20250915",
]

[project.optional-dependencies]
# PDF rendering. Optional because it needs system libraries (pango, fontconfig) that the
# worker image carries and a Windows developer machine does not. The product reports PDF
# as unavailable rather than failing when it is absent, so a missing renderer degrades one
# feature instead of the build.
#
# WeasyPrint rather than a headless browser: it executes no JavaScript and opens no
# sockets, which for a document rendered from third-party evidence is a stronger guarantee
# than a browser that merely has nothing to run.
pdf = ["weasyprint==69.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "S", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
# S608 flags SQL built by interpolation. Migrations are hand-authored DDL that never
# sees a request, and the only values interpolated are module constants -- kept as
# constants so a table list and the policies over it cannot drift apart. The rule still
# applies everywhere a query can be reached by user input.
"services/api/migrations/versions/*.py" = ["E501", "S608"]
# The smoke test drives a local stack from an operator's shell. S310 flags urlopen,
# whose URLs here are two module constants, both http and both loopback. S603/S607 flag
# invoking `docker` from PATH, which is deliberate: an operator's docker may be
# anywhere, and a hardcoded path would make the script work on exactly one machine.
"scripts/smoke_test.py" = ["S310", "S603", "S607"]
# The backup tool shells out to docker, psql and pg_dump, resolved from PATH for the
# same reason: an operator's tooling lives wherever they installed it. Table names are
# never interpolated without first being checked against IRREPLACEABLE_TABLES, since a
# manifest can arrive from wherever a backup was copied from.
"scripts/backup.py" = ["S603", "S607"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["scripts", "tests", "services/worker/src", "services/agent-gateway/src"]
mypy_path = ["services/api/src", "services/worker/src", "services/agent-gateway/src"]

# Celery ships no type information, so its decorators erase the signatures of the
# functions they wrap. The exemption is scoped to the one module that touches the
# broker; everything the correctness of a run depends on lives below it and is still
# checked strictly.
[[tool.mypy.overrides]]
module = "celery.*"
ignore_missing_imports = true

# PDF rendering is an optional extra, so on a machine without it installed there is
# nothing for mypy to read. Scoped to the one module that imports it, and that module
# already treats absence as an ordinary outcome rather than an error.
[[tool.mypy.overrides]]
module = "weasyprint.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "siembiot_worker.tasks"
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = "siembiot_worker.celery_app"
disallow_any_explicit = false

[tool.setuptools.packages.find]
# The gateway joins the other two rather than being reachable only by a `sys.path`
# insert in its own tests. It was importable nowhere else, so the workflow step that
# calls it reported `skipped_gateway_unavailable` on every run -- including runs where
# a model was configured and somebody was waiting for a narrative.
where = ["services/api/src", "services/worker/src", "services/agent-gateway/src"]
