[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "siembiot"
version = "0.0.0"
description = "Security-first community cyber health assessment platform"
requires-python = "==3.13.*"
license = "MIT"
dependencies = [
    "alembic==1.16.5",
    "cryptography==50.0.0",
    "dnspython==2.8.0",
    "fastapi==0.116.1",
    "httpx==0.28.1",
    "idna==3.18",
    "psycopg[binary]==3.2.9",
    "pydantic-settings==2.10.1",
    "pyjwt[crypto]==2.10.1",
    "sqlalchemy==2.0.43",
    "uvicorn==0.35.0",
]

[dependency-groups]
dev = [
    "jsonschema==4.25.1",
    "hypothesis==6.165.0",
    "mypy==1.17.1",
    "pytest==8.4.1",
    "pytest-postgresql==7.0.2",
    "ruff==0.12.8",
    "types-jsonschema==4.25.1.20251009",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "S", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
"services/api/migrations/versions/*.py" = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["scripts", "tests", "services/worker/src"]
mypy_path = ["services/api/src", "services/worker/src"]

[tool.setuptools.packages.find]
where = ["services/api/src", "services/worker/src"]
